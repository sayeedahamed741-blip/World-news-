<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR MOBILE</title>
<style>
body{margin:0;font-family:Arial;background:#eef2f7;padding-bottom:90px}
.top{background:white;padding:10px;text-align:center;box-shadow:0 2px 5px #ccc;position:sticky;top:0;z-index:10}
.page{padding:10px;display:none}#home{display:block}
.header{background:#0d47a1;color:white;padding:18px;text-align:center;border-radius:0 0 18px 18px}
.card{background:white;margin:10px 0;padding:12px;border-radius:12px;box-shadow:0 2px 6px #ccc}
.card img{width:100%;height:160px;object-fit:cover;border-radius:10px}
.btnRow{display:flex;gap:8px;margin-top:8px}
.btn{border:none;padding:12px;border-radius:25px;font-weight:bold;flex:1}
.btnBuy{background:#2e7d32;color:white}.btnCart{background:#d32f2f;color:white}
.bottomMenu{position:fixed;bottom:0;left:0;right:0;height:75px;background:#0d47a1;display:flex;justify-content:space-around;align-items:center;z-index:9999999;border-top:3px solid #ffeb3b}
.menuItem{color:white;text-align:center;font-size:11px;font-weight:bold;padding:8px 10px;border-radius:10px}
.menuItem.active{background:white;color:#0d47a1}
.input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:5px 0;box-sizing:border-box}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#0d47a1;color:white;padding:22px 30px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:99999999;font-weight:bold;text-align:center;display:none;min-width:250px;font-size:15px}
</style>
</head>
<body>
<div id="customToast" class="toast"></div>
<div class="top"><b>⭐ STAR MOBILE</b><br><input id="search" style="width:95%;padding:8px;border-radius:20px;border:1px solid #ccc;margin-top:8px" placeholder="🔍 Search..." onkeyup="searchFun()"></div
