<title>STAR MOBILE</title>
<style>
body{margin:0;font-family:Arial;background:#f0f4ff;padding-bottom:80px}
.top{background:white;padding:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 5px #ccc;position:sticky;top:0;z-index:10}
.top input{border:1px solid #ddd;border-radius:20px;padding:6px 10px;width:150px}
.page{padding:10px;min-height:80vh}
.header{background:linear-gradient(135deg,#0d47a1,#1976d2);color:white;padding:25px;text-align:center;border-radius:0 0 25px 25px}
.card{background:white;margin:12px 0;padding:15px;border-radius:15px;box-shadow:0 3px 10px rgba(0,0,0,0.1)}
.card img{width:100%;height:160px;object-fit:contain;border-radius:10px;background:#f9f9f9}
.btnRow{display:flex;gap:8px;margin-top:10px}
.btn{border:none;padding:12px;border-radius:25px;font-weight:bold;flex:1;cursor:pointer}
.btnBuy{background:#2e7d32;color:white}
.btnCart{background:#d32f2f;color:white}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 0;border-top:2px solid #0d47a1;z-index:100}
.nav{font-size:13px;color:gray;text-align:center;cursor:pointer;padding:5px 15px}
.nav.active{color:#0d47a1;font-weight:bold;background:#e3f2fd;border-radius:10px}
.input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:5px 0;box-sizing:border-box}
.badge{background:#e8f5e9;color:#2e7d32;padding:4px 8px;border-radius:10px;font-size:12px;font-weight:bold}
.profileBtn{background:white;margin:10px 0;padding:18px;border-radius:15px;box-shadow:0 3px 10px rgba(0,0,0,0.1);display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-left:5px solid #0d47a1}
</style>
</head>
